[package]
name = "esp32_no_std"
version = "0.1.0"
edition = "2021"

[dependencies]
esp-hal = { version = "1.1.1", features = ["esp32s3", "unstable", "rt"] }
esp-backtrace = { version = "0.19.0", features = ["esp32s3", "panic-handler", "println"] }
esp-println = { version = "0.17.0", features = ["esp32s3", "log-04"] }
dht-sensor = "0.2.1"
embedded-hal = { version = "0.2.7", features = ["unproven"] }
esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32s3"] }
libm = "0.2.8"

[profile.release]
opt-level = "s"
lto = true
